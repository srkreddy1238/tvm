# Checkout mainline commit on local repo and run tests.
name: Adreno Release Generation

on:
  workflow_dispatch:

concurrency:
  group: tvmpkg
  cancel-in-progress: true

jobs:
  BuildPackageLinux:
    if: github.repository == 'gpgpu/apache-tvm'
    runs-on: tvm-linux-ci
    steps:
      - uses: actions/checkout@v2
        with:
            submodules: 'recursive'
            fetch-depth: 0
      - name: Build CPU Host Wheel
        shell: bash -l {0}
        run: |
           set -e
           RELEASE_TAG=`cat adreno_version.txt`
           docker run --rm --pid=host -w /workspace \
               -v ${PWD}:/workspace \
               -v ${ADRENO_OPENCL}:/adreno_opencl \
               -e ADRENO_OPENCL=/adreno_opencl \
               -e ENV_USER_ID=`id -u` \
               -e ENV_GROUP_ID=`id -g` \
               mlcaidev/package-cu121 \
               conda run -n py38 ./ci/adreno/build_lib.sh
           docker run --rm --pid=host -w /workspace \
               -v ${PWD}:/workspace \
               -v ${ADRENO_OPENCL}:/adreno_opencl \
               -e ADRENO_OPENCL=/adreno_opencl \
               -e ENV_USER_ID=`id -u` \
               -e ENV_GROUP_ID=`id -g` \
               -e WHEEL_EXT_NAME="_adreno_cpu_"${RELEASE_TAG} \
               mlcaidev/package-cu121 \
               conda run -n py38 ./ci/adreno/build_wheel.sh
           mkdir -p release
           cp wheels/*.whl release/
           docker run --rm --pid=host -w /workspace \
               -v ${PWD}:/workspace \
               -v ${ADRENO_OPENCL}:/adreno_opencl \
               -e ADRENO_OPENCL=/adreno_opencl \
               -e ENV_USER_ID=`id -u` \
               -e ENV_GROUP_ID=`id -g` \
               mlcaidev/package-cu121 \
               conda run -n py38 ./ci/adreno/build_clean.sh
      - name: Build CUDA Host Wheel
        shell: bash -l {0}
        run: |
           set -e
           RELEASE_TAG=`cat adreno_version.txt`
           docker run --rm --pid=host -w /workspace \
               -v ${PWD}:/workspace \
               -v ${ADRENO_OPENCL}:/adreno_opencl \
               -e ADRENO_OPENCL=/adreno_opencl \
               -e ENV_USER_ID=`id -u` \
               -e ENV_GROUP_ID=`id -g` \
               -e GPU=cuda \
               mlcaidev/package-cu121 \
               conda run -n py38 ./ci/adreno/build_lib.sh
           docker run --rm --pid=host -w /workspace \
               -v ${PWD}:/workspace \
               -v ${ADRENO_OPENCL}:/adreno_opencl \
               -e ADRENO_OPENCL=/adreno_opencl \
               -e ENV_USER_ID=`id -u` \
               -e ENV_GROUP_ID=`id -g` \
               -e WHEEL_EXT_NAME="_adreno_cuda_"${RELEASE_TAG} \
               -e GPU=cuda \
               mlcaidev/package-cu121 \
               conda run -n py38 ./ci/adreno/build_wheel.sh
           cp wheels/*.whl ./release/ -rfa
           docker run --rm --pid=host -w /workspace \
               -v ${PWD}:/workspace \
               -v ${ADRENO_OPENCL}:/adreno_opencl \
               -e ADRENO_OPENCL=/adreno_opencl \
               -e ENV_USER_ID=`id -u` \
               -e ENV_GROUP_ID=`id -g` \
               -e GPU=cuda \
               mlcaidev/package-cu121 \
               conda run -n py38 ./ci/adreno/build_clean.sh
      - name: Build Target
        shell: bash -l {0}
        run: |
           set -e
           mkdir -p build-adreno-target
           cd build-adreno-target
           cp ../cmake/config.cmake . -f
           echo set\(USE_CLML "${ADRENO_OPENCL}"\)  >> config.cmake
           echo set\(USE_CLML_GRAPH_EXECUTOR "${ADRENO_OPENCL}"\) >> config.cmake
           echo set\(USE_RPC ON\) >> config.cmake
           echo set\(USE_CPP_RPC ON\) >> config.cmake
           echo set\(USE_CPP_RTVM ON\) >> config.cmake
           echo set\(USE_GRAPH_EXECUTOR ON\) >> config.cmake
           echo set\(USE_LIBBACKTRACE AUTO\) >> config.cmake
           echo set\(USE_KALLOC_ALIGNMENT 16\) >> config.cmake
           echo set\(ANDROID_ABI arm64-v8a\) >> config.cmake
           echo set\(ANDROID_PLATFORM android-28\) >> config.cmake
           echo set\(MACHINE_NAME aarch64-linux-gnu\) >> config.cmake
           cmake -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK}/build/cmake/android.toolchain.cmake" \
                 -DANDROID_ABI=arm64-v8a \
                 -DANDROID_PLATFORM=android-28 \
                 -DCMAKE_SYSTEM_VERSION=1 \
                 -DCMAKE_FIND_ROOT_PATH="${ADRENO_OPENCL}" \
                 -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
                 -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
                 -DCMAKE_CXX_COMPILER="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++" \
                 -DCMAKE_C_COMPILER="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" \
                 -DMACHINE_NAME="aarch64-linux-gnu" ..
            cmake --build . --parallel $(nproc)
            cd -
      - name: Build Adreno Utils
        shell: bash -l {0}
        run: |
           set -e
           RELEASE_TAG=`cat adreno_version.txt`
           cp build-adreno-target/tvm_rpc adreno-utils/ -rfa
           cp build-adreno-target/rtvm adreno-utils/ -rfa
           cp build-adreno-target/libtvm_runtime.so adreno-utils/ -rfa
           tar jcvfp adreno-utils-linux-arm64-$Env:RELEASE_TAG.tar.bz2 adreno-utils
           cp adreno-utils-linux-arm64-$Env:RELEASE_TAG.tar.bz2 ./release/ -rfa
           gh release delete tvm-release-${RELEASE_TAG} --cleanup-tag --yes --repo "$RELEASE_REPO" || true
           gh release create tvm-release-${RELEASE_TAG} --latest --title tvm-release-${RELEASE_TAG} --repo "$RELEASE_REPO" --notes "TVM Release builds"
           gh release upload tvm-release-${RELEASE_TAG} ./release/* --clobber --repo "$RELEASE_REPO"
           mkdir -p ${CI_PACKAGE_REPO_RELEASE}/TVM/${RELEASE_TAG}
           mv ./release/* ${CI_PACKAGE_REPO_RELEASE}/TVM/${RELEASE_TAG}/
           rm -rf release
  BuildPackageWindows:
    needs: [BuildPackageLinux]
    if: ${{ github.repository == 'gpgpu/apache-tvm' }}
    runs-on: tvm-windows
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
          ref: ''
      - name: Compile X86
        shell: powershell
        run: |
           Push-Location
           New-Item -ItemType Directory -Force -Path "./build"
           cd build
           cp ../cmake/config.cmake .
           Add-Content config.cmake "set(USE_OPENCL $ENV:OPENCL_SDK_ADRENO_X86)"
           Add-Content config.cmake "set(USE_LLVM $ENV:LLVM_CONFIG)"
           Add-Content config.cmake "set(USE_CLML $ENV:OPENCL_SDK_ADRENO_X86)"
           Add-Content config.cmake "set(USE_CLML_GRAPH_EXECUTOR $ENV:OPENCL_SDK_ADRENO_X86)"
           Add-Content config.cmake "set(USE_CPP_RTVM ON)"
           Add-Content config.cmake "set(USE_RPC ON)"
           Add-Content config.cmake "set(USE_CPP_RPC ON)"
           Add-Content config.cmake "set(USE_GRAPH_EXECUTOR ON)"
           Add-Content config.cmake "set(USE_KALLOC_ALIGNMENT 16)"
           Add-Content config.cmake "set(USE_OPENCL_EXTN_QCOM ON)"
           cmake .. -G "Visual Studio 17 2022" -A x64
           cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS
           Pop-Location
      - name: Check Build X86 Status
        shell: powershell
        run: |
           $env:PYTHONPATH = "$pwd\python"
           python -c "import tvm; print(tvm.__path__)"
      - name: Compile Arm64
        shell: powershell
        run: |
           Push-Location
           New-Item -ItemType Directory -Force -Path "./build-arm64"
           cd build-arm64
           cp ../cmake/config.cmake .
           Add-Content config.cmake "set(USE_OPENCL $ENV:OPENCL_SDK_ADRENO_ARM64)"
           Add-Content config.cmake "set(USE_CLML $ENV:OPENCL_SDK_ADRENO_ARM64)"
           Add-Content config.cmake "set(USE_CLML_GRAPH_EXECUTOR $ENV:OPENCL_SDK_ADRENO_ARM64)"
           Add-Content config.cmake "set(USE_CPP_RTVM ON)"
           Add-Content config.cmake "set(USE_RPC ON)"
           Add-Content config.cmake "set(USE_CPP_RPC ON)"
           Add-Content config.cmake "set(USE_GRAPH_EXECUTOR ON)"
           Add-Content config.cmake "set(USE_KALLOC_ALIGNMENT 16)"
           Add-Content config.cmake "set(USE_OPENCL_EXTN_QCOM ON)"
           cmake .. -G "Visual Studio 17 2022" -A ARM64 -DCMAKE_OSX_ARCHITECTURES=arm64
           cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS
           Pop-Location
      - name: Build Package and Publish
        shell: powershell
        run: |
           Push-Location
           $Env:RELEASE_TAG=Get-Content -path adreno_version.txt
           cd python
           $Env:WHEEL_EXT_NAME="_adreno_cpu_x86_$Env:RELEASE_TAG"
           python.exe .\setup.py bdist_wheel --plat-name win_amd64
           Pop-Location
           Compress-Archive -Path ".\\build-arm64\Release\*" -CompressionLevel Optimal -DestinationPath adreno-utils-win-arm64-$Env:RELEASE_TAG.zip -Force
           Compress-Archive -Path ".\\build\Release\*" -CompressionLevel Optimal -DestinationPath adreno-utils-win-x86-$Env:RELEASE_TAG.zip -Force
           foreach ($i in Get-ChildItem -Path python\dist) {gh release upload tvm-release-$Env:RELEASE_TAG .\python\dist\$i --clobber --repo $Env:RELEASE_REPO}
           gh release upload tvm-release-$Env:RELEASE_TAG adreno-utils-win-arm64-$Env:RELEASE_TAG.zip --clobber --repo $Env:RELEASE_REPO
           gh release upload tvm-release-$Env:RELEASE_TAG adreno-utils-win-x86-$Env:RELEASE_TAG.zip --clobber --repo $Env:RELEASE_REPO
           # Copy to common Linux CI
           New-Item -ItemType Directory -Force -Path "$Env:CI_PACKAGE_REPO_RELEASE/TVM/$Env:RELEASE_TAG"
           Copy-Item -Path adreno-utils-win-arm64-$Env:RELEASE_TAG.zip -Destination "$Env:CI_PACKAGE_REPO_RELEASE/TVM/$Env:RELEASE_TAG"
           Copy-Item -Path adreno-utils-win-x86-$Env:RELEASE_TAG.zip -Destination "$Env:CI_PACKAGE_REPO_RELEASE/TVM/$Env:RELEASE_TAG"
           foreach ($i in Get-ChildItem -Path python\dist) {Copy-Item -Path .\python\dist\$i -Destination "$Env:CI_PACKAGE_REPO_RELEASE/TVM/$Env:RELEASE_TAG"}
           rm .\python\build -r -Force -ErrorAction Ignore
           rm .\python\dist -r -Force -ErrorAction Ignore
           rm .\python\*.egg-info -r -Force -ErrorAction Ignore
        env:
           GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
